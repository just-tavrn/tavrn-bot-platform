version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly }
    groups:
      javascript:
        patterns: ["*"]
    ignore:
      # Playwright stays on the version whose Chromium the other repositories' runners have cached.
      - dependency-name: "@playwright/test"
        update-types: ["version-update:semver-minor"]
      # @types/node follows the Node LTS the runner image uses.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: docker
    directory: /
    schedule: { interval: weekly }
    ignore:
      # The Node image stays on the LTS line (Node 25 is a current, not an LTS release).
      - dependency-name: node
        update-types: ["version-update:semver-major"]
