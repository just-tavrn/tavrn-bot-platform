# A single package; the file exists for pnpm's settings.
packages:
  - "."

# Only these packages may run install scripts (pnpm >= 12: allowBuilds).
allowBuilds:
  esbuild: true

# The @tavrn packages are released together and installed while fresh.
minimumReleaseAgeExclude:
  - "@tavrn/*"
  - happy-dom@21.0.3

# Keep all bot runtime packages on the same tested commit until the next package release.
blockExoticSubdeps: false
overrides:
  "@tavrn/bot": "github:just-tavrn/tavrn-js#ce905e164328c30bb69a5a1632367796a000d375&path:bot"
  "@tavrn/sdk": "github:just-tavrn/tavrn-js#ce905e164328c30bb69a5a1632367796a000d375&path:sdk"
  "@tavrn/e2ee": "github:just-tavrn/tavrn-js#ce905e164328c30bb69a5a1632367796a000d375&path:e2ee"
