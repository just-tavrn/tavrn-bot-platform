# A single package; the file exists for pnpm's settings.
packages:
  - "."

# Only these packages may run install scripts (pnpm >= 12: allowBuilds).
allowBuilds:
  esbuild: true

# The @tavrn packages are released together and installed while fresh.
minimumReleaseAgeExclude:
  - "@tavrn/*"
  - happy-dom@21.0.3
